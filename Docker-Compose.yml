version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: shopflow_redis
    ports:
      - "6379:6379"

  api:
    build: ./application/api
    container_name: shopflow_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  worker:
    build: ./application/worker
    container_name: shopflow_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis