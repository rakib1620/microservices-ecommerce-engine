name: API CI/CD

on:
  push:
    branches: [ "main", "fix/**", "feat/**", "worker/**", "new/**", "test/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: microservices-ecommerce-api

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::993952121311:role/UPDATE-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug OIDC Identity
        run: |
          echo "🔍 Current Branch: ${{ github.ref_name }}"
          echo "🔍 Repository: ${{ github.repository }}"
          aws sts get-caller-identity || echo "❌ Failed to get identity"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "📦 Building Docker image..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ./app/api
          echo "📤 Pushing image to ECR..."
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "✅ Image pushed successfully!"
          echo "📍 Image URI: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
